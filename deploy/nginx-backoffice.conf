# Snippet for serving the Vite backoffice SPA on nginx.
# Prevents /assets/*.js 404s from returning index.html (which causes MIME type errors).

server {
    listen 80;
    server_name _;

    root /var/www/clivio/backoffice/dist;
    index index.html;

    # Never cache the shell — always pick up new asset hashes after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build assets — return real 404 if missing (don't fall back to index.html).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
