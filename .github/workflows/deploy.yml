name: Deploy Backoffice

on:
  push:
    branches: [main, jolie]

jobs:
  deploy-default:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy default client
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/clivio/backoffice
            git fetch origin main
            git checkout main
            git pull origin main
            npm install
            npm run build

  deploy-jolie:
    if: github.ref == 'refs/heads/jolie'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Jolie client
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/jolie/backoffice
            git fetch origin jolie
            git checkout jolie
            git pull origin jolie
            npm install
            npm run build:jolie
